services:
  netflix_db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - netflix_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 10s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3

  netflix_api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      netflix_db:
        condition: service_healthy
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - netflix_internal
      - dokploy-network

volumes:
  postgres_data:

networks:
  netflix_internal:
    driver: bridge
  dokploy-network:
    external: true
